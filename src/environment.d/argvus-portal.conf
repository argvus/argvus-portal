# ARGVUS Wayland, DBus and portal environment defaults.
#
# This file is read by the systemd user manager through systemd.environment.d.
# argvus-sessionctl import-environment refreshes these values for the active
# Hyprland session and mirrors them to DBus activation when available.

ARGVUS_SYSTEM_CONFIG=/usr/share/argvus
XDG_CONFIG_DIRS=/usr/share/argvus:/etc/xdg

XDG_CURRENT_DESKTOP=Hyprland
XDG_SESSION_DESKTOP=Hyprland
XDG_SESSION_TYPE=wayland
DESKTOP_SESSION=argvus
GDMSESSION=argvus

QT_QPA_PLATFORM=wayland
QT_QPA_PLATFORMTHEME=qt6ct
QT_QUICK_CONTROLS_STYLE=org.hyprland.style

MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=auto
SDL_VIDEODRIVER=wayland
_JAVA_AWT_WM_NONREPARENTING=1
SAL_USE_VCLPLUGIN=gtk3

XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
